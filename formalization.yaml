# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Triangular minimality for planar Coulomb renormalized energy"
  description: >-
    A Lean 4 and Mathlib formalization of the minimality of the triangular
    lattice for the planar Coulomb renormalized energy, following the OpenAI
    preprint of 23 September 2026. For every cutoff family and every
    admissible field E (locally integrable, div E = 2 pi (nu - 1), curl E = 0,
    bounded density of charges) the renormalized energy W(E) is at least the
    energy W_tri of the one-point triangular torus, which is the energy of
    the triangular field; so the triangular lattice of covolume one minimizes
    W. The proof rests on the lower bound n W_tri for n points on the square
    torus C/(sqrt n Z[i]), established by the paper's calibration argument and
    a finite certificate whose interval computation is replaced by Boolean
    checks that the Lean kernel evaluates. The library also proves the
    corollary for the sphere, that the minimal logarithmic energy of n points
    on S^2 is (1/2 - log 2) n^2 - (n/2) log n + C_BHS n + o(n) with the
    constant of Brauchart, Hardin and Saff, and the corresponding lower bound,
    in the case d = 2, s = 0, m = 1, for the jellium energy of Chapter 11 of
    Serfaty's Lectures on Coulomb and Riesz gases, for fields and for
    configurations. The other stated theorems show that the objects of the
    statements are well defined (fundamental domain, existence and uniqueness
    of the torus potential, existence of the puncture limits), give the energy
    of the triangular field of the lectures, and identify the energy of
    Definition 11.4 with the neutral energy. The proofs use
    only Lean's standard axioms. Errata found in the sources, and the places
    where the Lean statements differ from them, are recorded in
    docs/ERRATA-AND-DEVIATIONS.md.
  authors:
    - "Scott Armstrong"
    - "Sylvia Serfaty"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Sylvia Serfaty"
  affiliations:
    - "Scott Armstrong: CNRS and Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
    - "Sylvia Serfaty: Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."
    - "Sylvia Serfaty was supported by a Simons Investigator award, NSF grant DMS-2247846, and the Institut Universitaire de France."

classification:
  arxiv: ["math-ph", "math.AP"]
  msc2020: ["82B05", "52C15", "31A05", "35Q56"]

sources:
  - title: "Triangular minimality for planar Coulomb renormalized energy"
    authors: ["OpenAI"]
    type: "paper"
    id: "OpenAI Math Release, 23 September 2026"
    url: "https://github.com/openai/math/tree/main/preprints/Triangular-minimality-for-planar-Coulomb-renormalized-energy-September-23-2026"
    location: "Theorem 1.1, Theorem 1.2, Corollary 1.3, with Lemmas 2.1 and 2.3"
    relationship: "formalizes"
    note: >-
      Theorem 1.1 is stated with W_tri, the energy of the one-point triangular
      torus, and split into the lower bound and the value of the triangular
      field; the identification W(E_tri) = W_tri is a separate theorem.
      The source is a preprint. The interval-arithmetic verification of the preprint is replaced by a
      certificate checked by the Lean kernel. Eight gaps, one misprint and
      eight deviations are recorded in docs/ERRATA-AND-DEVIATIONS.md. The authors
      of the preprint have not reviewed this formalization.
    license: "Apache-2.0"
    author_endorsement: "other"
  - title: "Lectures on Coulomb and Riesz gases"
    authors: ["Sylvia Serfaty"]
    type: "book"
    id: "arxiv:2407.21194"
    url: "https://arxiv.org/abs/2407.21194"
    location: "Chapter 11: Definitions 11.1, 11.4 and 11.6, formulas (4.1.18) and (11.2.2)-(11.2.6)"
    relationship: "formalizes"
    note: >-
      The energies of Chapter 11 in the case d = 2, s = 0, m = 1, and the
      lower bound W_tri/(2 pi) for them, which is the preprint's theorem in
      the normalization of the lectures (proved here by a screening
      construction followed by Theorem 1.2, not by the lectures' route). The
      other results of the chapter, other dimensions, kernels and densities are
      not formalized. The source is a book of lecture notes. Four errors
      (among them Lemma 11.2), nine gaps, two misprints and four deviations
      are recorded in docs/ERRATA-AND-DEVIATIONS.md.
    license: "unknown"
    author_endorsement: "participated"
  - title: "From the Ginzburg-Landau model to vortex lattice problems"
    authors: ["Étienne Sandier", "Sylvia Serfaty"]
    type: "paper"
    id: "arxiv:1011.4617"
    url: "https://arxiv.org/abs/1011.4617"
    location: "Communications in Mathematical Physics 313 (2012)"
    relationship: "background"
    note: "A journal article. Origin of the renormalized energy W and of the conjecture that the triangular lattice minimizes it. Cited by the preprint; its theorems are not used. One misprint is recorded in docs/ERRATA-AND-DEVIATIONS.md."
    license: "unknown"
    author_endorsement: "participated"
  - title: "Renormalized energy and asymptotic expansion of optimal logarithmic energy on the sphere"
    authors: ["Laurent Bétermin", "Étienne Sandier"]
    type: "paper"
    id: "arxiv:1404.4485"
    url: "https://arxiv.org/abs/1404.4485"
    location: "Constructive Approximation 47 (2018)"
    relationship: "background"
    note: "A journal article. Relates the linear term of the logarithmic energy on the sphere to the planar renormalized energy. The formal proof of Corollary 1.3 follows a different route. One gap, two misprints and one unverified candidate are recorded in docs/ERRATA-AND-DEVIATIONS.md."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "The next-order term for optimal Riesz and logarithmic energy asymptotics on the sphere"
    authors: ["Johann S. Brauchart", "Douglas P. Hardin", "Edward B. Saff"]
    type: "paper"
    id: "arxiv:1202.4037"
    url: "https://arxiv.org/abs/1202.4037"
    location: "Contemporary Mathematics 578 (2012)"
    relationship: "background"
    note: "A journal article. Source of the constant C_BHS and of the conjecture of which Corollary 1.3 is the case d = 2. It was not checked for errors, and no defect is recorded in docs/ERRATA-AND-DEVIATIONS.md."
    license: "unknown"
    author_endorsement: "not-contacted"

status:
  scope: >-
    Complete for the 13 stated theorems and 28 definitions: Theorem 1.1
    (lower bound W(E) >= W_tri for every cutoff family and every admissible
    field, and the value W(E_tri) = W_tri with E_tri admissible), Theorem 1.2
    (n W_tri on square tori, n >= 2), Corollary 1.3 (the asymptotics of the
    minimal logarithmic energy on the sphere), the lower bound W_tri/(2 pi)
    for the neutral jellium energy of fields and the energy of configurations
    in Chapter 11 of the lectures (d = 2, s = 0, m = 1), the equality of the
    energy of Definition 11.4 with the neutral energy for large C_0, and the
    well-posedness theorems. The infimum identity inf W = W(E_tri) is
    obtained from the two parts of Theorem 1.1 and is not a separate Lean
    formula; the minimum in Corollary 1.3 is an infimum, and its attainment
    is proved in the library (SandierSerfaty.Sphere.exists_isSphereMinimizer
    and SandierSerfaty.Sphere.Bridge.sphereLogEnergy_eq) but is not one of
    the 13 stated theorems. The other results of Chapter 11, other dimensions,
    kernels and densities are not formalized. Eight of the 13 theorems are in
    the core library; the five that rest on the certificate (Theorems 1.1
    and 1.2, Corollary 1.3 and the two Chapter 11 lower bounds) are in the
    opt-in library SandierSerfatyCert.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "SandierSerfaty.triangularEnergy_le_wholeEnergy"
      file: "SandierSerfaty/Statements/Whole/Theorems/TriangularEnergyLeWholeEnergy.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "SandierSerfaty.paperTriangularField_spec"
      file: "SandierSerfaty/Statements/Whole/Theorems/PaperTriangularFieldSpec.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "SandierSerfaty.mul_triangularEnergy_le_torusEnergy"
      file: "SandierSerfaty/Statements/Torus/Theorems/MulTriangularEnergyLeTorusEnergy.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "SandierSerfaty.sphereLogEnergy_asymptotics"
      file: "SandierSerfaty/Statements/Sphere/Theorems/SphereLogEnergyAsymptotics.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
