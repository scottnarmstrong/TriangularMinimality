automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
        - "claude-sonnet-5-5"
      framework: >-
        Claude Code (Anthropic), under the authors'
        supervision. A Claude Opus 5.5 session coordinated the work: it
        planned bounded proof tasks, assigned them to parallel agents, and
        adjudicated statement and proof reviews. The Lean code was written by
        Claude Sonnet 5.5 and Claude Opus 5.5 agents in Claude Code.
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0. A source-level dependency graph of the
        preprint and of Chapter 11 was built first. Every public definition
        and theorem statement was written, checked against the sources by an
        independent model review, and accepted by the author before its proof
        was developed. The numerical certificate is generated by an untrusted
        native program and re-checked by the Lean kernel. Verification uses
        full builds from a clean checkout, axiom checks, and a Mathlib-only
        comparator Challenge checked with Lean's comparator and the
        independent kernel checkers bundled with the toolchain.
      cost:
        wall_time: "about three days of development (12-14 November 2026) plus release preparation"
        spend_usd: "not separately tracked (subscription plans)"
        hardware: "one Linux workstation (16 cores, 124 GB RAM); the kernel certificate takes about 14 CPU-hours"
      prompting_notes: >-
        The author chose the formal targets, ruled on every deviation from the
        printed statements, and accepted every public statement. Errata and
        gaps in the printed proofs were identified by agent reviews of the
        sources and repaired by arguments that were checked before they were
        formalized.
  spend_usd: "not separately tracked (subscription plans)"
  notes: >-
    All Lean code was written by the listed models under the supervision of
    the authors. Every proof is checked by the Lean kernel; the library
    contains no sorry, no custom axiom and no native_decide. The comparator
    Challenge file contains one intentional sorry per theorem, proved by the
    Solution file from this repository.

fidelity:
  divergences: >-
    Theorems 1.1 and 1.2 are stated with W_tri, the energy of the one-point
    triangular torus, in place of W(E_tri); the identification is
    paperTriangularField_spec, and Theorem 1.1 is split into the lower bound
    and the triangular value, from which the infimum identity follows. The
    potential on the torus is defined in classical form (smooth off the
    charges, Delta h = 2 pi there, logarithmic singularity, mean zero), which
    is equivalent to the distributional form of the paper; the torus energy
    and the puncture limits are defined by limsup or limUnder, and separate
    theorems show that the limits exist. Fields, charges and the plane are
    modelled on C with its Euclidean norm; configurations are sets, so
    charges are simple. Energies that may be infinite take values in
    [-infinity, +infinity]. The minimum in Corollary 1.3 is the infimum, and
    the remainder o(n) is given with an exact identity for every n >= 2. The
    jellium energies are those of Chapter 11 of the lectures (factor 1/(4 pi)
    in place of the paper's 1/2, opposite sign of the field), in the case
    d = 2, s = 0, m = 1 only; the lower bound is proved by a screening
    construction followed by Theorem 1.2, and Theorem 1.1 and Corollary 1.3
    by routes that do not use the papers of Sandier and Serfaty or of
    Bétermin and Sandier. The interval verification of the preprint is
    replaced by a certificate checked by the kernel. The sources contain
    4 errors, 18 gaps, 6 misprints and 1 unverified candidate (Lemma 11.2 of
    the lectures is false in the boundary layer and is not used), and 12
    deviations are listed; none changes a stated theorem. See
    docs/ERRATA-AND-DEVIATIONS.md.

review:
  status: "author-verified-statements"
  reviewers:
    - "Scott Armstrong"
  notes: >-
    Lean checks each proof against its formal statement. The author reviewed
    the exact Lean definitions and theorem statements before proof work, and
    each was checked against the sources by an independent model review. This
    is not external peer review, and the authors of the preprint have not
    reviewed the formalization.

alignment:
  namespace: "SandierSerfatyChallenge"
  statements:
    - source: "Preprint, Theorem 1.1 (inequality W(E) >= W(E_tri))"
      lean: "SandierSerfatyChallenge.triangularEnergy_le_wholeEnergy"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "For every cutoff family and every admissible field, W(E) >= W_tri in the extended reals; W_tri = W(E_tri) by paperTriangularField_spec. The same statement is SandierSerfaty.triangularEnergy_le_wholeEnergy in the library."
    - source: "Preprint, Theorem 1.1 (value of the triangular field, finiteness) with Lemma 2.3"
      lean: "SandierSerfatyChallenge.paperTriangularField_spec"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "The triangular field is admissible and W(E_tri) = W_tri for every cutoff family; with the previous theorem this gives inf W = W(E_tri)."
    - source: "Preprint, Theorem 1.2"
      lean: "SandierSerfatyChallenge.mul_triangularEnergy_le_torusEnergy"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "For n >= 2 points with distinct classes on C/(sqrt n Z[i]), the energy (1.6) of the mean-zero potential is at least n W_tri."
    - source: "Preprint, Corollary 1.3, (1.7) and (1.8)"
      lean: "SandierSerfatyChallenge.sphereLogEnergy_asymptotics"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "Asymptotics of the infimum of the ordered-pair logarithmic energy of n points of S^2 with the constant C_BHS, with an exact identity for every n >= 2."
    - source: "Preprint, remark after (1.4) and Lemma 2.1"
      lean: "SandierSerfatyChallenge.tendsto_punctureFunctional"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "The local puncture limit exists and is finite for admissible fields and smooth compactly supported weights, so the limsup in the definition of the local energy is a limit."
    - source: "Preprint, Section 1 (the torus T_n and the energy (1.6))"
      lean: "SandierSerfatyChallenge.torusDomain_spec"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "The chosen domain is a fundamental domain, and integrals of periodic functions over it do not depend on the choice."
    - source: "Preprint, Section 1 (the mean-zero periodic solution of -Delta h = 2 pi (sum of deltas - 1))"
      lean: "SandierSerfatyChallenge.existsUnique_isTorusPotential"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "Existence and uniqueness of the torus potential in classical form, for N charges with distinct classes on a torus of area N."
    - source: "Preprint, Section 1 (the mean-zero periodic solution of -Delta h = 2 pi (sum of deltas - 1))"
      lean: "SandierSerfatyChallenge.torusPotential_spec"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "The chosen function torusPotential is the torus potential."
    - source: "Preprint, (1.6)"
      lean: "SandierSerfatyChallenge.tendsto_torusEnergy"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "The puncture limit defining the torus energy exists and is finite."
    - source: "Lectures, Chapter 11 (Definitions 11.1 and 11.4), with the preprint's Theorem 1.1"
      lean: "SandierSerfatyChallenge.div_two_pi_triangularEnergy_le_neutralEnergy"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "W^neu(E,1) >= W_tri/(2 pi) for every configuration and every E in Elec(C,1), in the extended reals; d = 2, s = 0, m = 1. The minimality is the preprint's result in the normalization of the lectures, not a statement of the lectures."
    - source: "Lectures, Chapter 11 (Proposition 11.11, with one point per period cell)"
      lean: "SandierSerfatyChallenge.triangularField_spec"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "The triangular field lies in Elec(Lambda_tri,1) and has neutral energy W_tri/(2 pi)."
    - source: "Lectures, Chapter 11 (Definition 11.6)"
      lean: "SandierSerfatyChallenge.configEnergy_triangularLattice"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "The energy of the triangular lattice is W_tri/(2 pi) and is at most the energy of every configuration."
    - source: "Lectures, Chapter 11 (Definition 11.4)"
      lean: "SandierSerfatyChallenge.exists_jelliumEnergy_eq_neutralEnergy"
      module: "SandierSerfatyChallenge"
      status: "proved"
      note: "The energy W_{C_0} of Definition 11.4 equals the neutral energy for every sufficiently large C_0, so the lower bounds hold for W_{C_0}."

