    - declaration: "SandierSerfaty.div_two_pi_triangularEnergy_le_neutralEnergy"
      file: "SandierSerfaty/Statements/Jellium/Theorems/DivTwoPiTriangularEnergyLeNeutralEnergy.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "SandierSerfaty.configEnergy_triangularLattice"
      file: "SandierSerfaty/Statements/Jellium/Theorems/ConfigEnergyTriangularLattice.lean"
      sorry_count: 0
