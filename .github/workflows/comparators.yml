name: Comparators

# Runs by hand only (workflow_dispatch). It needs a completed certificate build of the commit, and the
# replay of the kernel certificate by the independent kernels may not fit in one 6-hour hosted job (see
# the comment on the job); the README describes how to run the comparator locally.
#
# Judges SandierSerfatySolution.lean against SandierSerfatyChallenge.lean the way the registry does,
# with the `lake comparator` that ships in the project's own toolchain (through
# scripts/verify-comparator.sh): the Solution must prove theorems whose statements, with their whole
# dependency closures, are identical to the Mathlib-only Challenge's, using only the permitted axioms,
# and the Lean kernel and the toolchain's independent kernels (NanoDa, con-ron) must accept it.
#
# This workflow does not build the library. The Solution imports the certificate library, so run
# "Build and verify" with `certificate` on, until it succeeds, for the commit to be judged; this
# workflow restores that run's build cache (`fail-on-cache-miss`).
"on":
  workflow_dispatch:

permissions:
  contents: read

# A run in progress is never cancelled: one comparator run takes hours and builds nothing that a later
# run could resume from.
concurrency:
  group: comparators-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comparators:
    name: Check Challenge against Solution
    runs-on: ubuntu-24.04
    # GitHub's hard maximum for a hosted job. The replay of the Solution includes the replay of the
    # kernel certificate by the independent kernels, which has not been measured on a hosted runner: it
    # may not fit, in which case the README tells readers to run the comparator locally.
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The exported environments of the Challenge and the Solution, the build artifacts, the toolchain
      # and the NanoDa replay need more disk than a hosted runner has free at start; without this step
      # the replay ends with "no space left on device". Only remove preinstalled, unused SDKs on
      # disposable hosted runners, and fail at once if less than 30 GiB is available.
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          # Only remove preinstalled, unused SDKs on disposable hosted runners.
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 31457280

      # The comparator needs more memory than a hosted runner has. A swap file turns an out-of-memory
      # kill into a slow step. It goes on /mnt, which has its own disk; without 28 GiB free there it is
      # skipped, never taken from the disk the comparator needs.
      - name: Add swap
        run: |
          set -Eeuo pipefail
          free_kib="$( (df -Pk /mnt 2>/dev/null || true) | awk 'NR==2 {print $4}')"
          free_kib="${free_kib:-0}"
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted && "$free_kib" -ge 29360128 ]]; then
            sudo fallocate -l 24G /mnt/ci-swap
            sudo chmod 600 /mnt/ci-swap
            sudo mkswap /mnt/ci-swap
            sudo swapon /mnt/ci-swap
          else
            echo "No swap file added (/mnt has $((free_kib / 1048576)) GiB free)."
          fi
          free -h

      - name: Check Lean source requirements
        run: python3 scripts/check_lean_modules.py --root .

      # Install the toolchain from `lean-toolchain` and fetch the Mathlib cache.
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: false
          use-mathlib-cache: true
          use-github-cache: false

      # The most recent entry that "Build and verify" saved for this commit (prefix `lake-build-`). With
      # none at all the step fails, and so does this run, because a cold build does not fit in this job.
      # This workflow saves no build cache of that prefix; the `lake-comparators-` prefix is its own.
      - name: Restore the build run's artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-comparators-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-
          fail-on-cache-miss: true

      - name: Install bubblewrap for lake comparator's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which bwrap needs; the
        # runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # `lake comparator` finds the Challenge, the Solution and the library built, exports both
      # environments and replays the Solution through the Lean kernel and the toolchain's independent
      # kernels.
      - name: Run the toolchain's lake comparator
        timeout-minutes: 300
        run: ./scripts/verify-comparator.sh
